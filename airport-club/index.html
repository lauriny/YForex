<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171b33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Airport – Club Simulator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- HUD oben -->
    <header id="hud">
      <button id="btn-settings" title="Einstellungen">⚙️</button>
      <div class="pill" id="hud-level"><span class="pill-icon">⭐</span><span class="pill-val">Lvl 1</span></div>
      <div class="hud-spacer"></div>
      <div class="pill" id="hud-gems"><span class="pill-icon">💎</span><span class="pill-val">0</span></div>
      <div class="pill" id="hud-cash"><span class="pill-icon">💵</span><span class="pill-val">0</span></div>
    </header>

    <!-- Upgrade-Karten -->
    <div id="upgrade-cards"></div>

    <!-- Club-Ansicht (alle Räume im Grundriss) -->
    <div id="club-view">
      <canvas id="club-canvas"></canvas>
      <div id="event-banner"></div>
      <!-- Kopfzeile der Raum-Detailansicht -->
      <div id="room-hud" class="hidden">
        <button id="room-back">‹ Übersicht</button>
        <div id="room-switch">
          <button id="room-prev" class="room-arrow" title="Vorheriger Raum">‹</button>
          <button id="room-title" title="Raum wählen"></button>
          <button id="room-next" class="room-arrow" title="Nächster Raum">›</button>
        </div>
      </div>
      <!-- schwebende Seiten-Buttons (Tycoon-Style) -->
      <div id="side-rail">
        <button class="rail-btn" id="btn-quests" title="Aufgaben & Phase"><span class="rail-emoji">📋</span><span class="rail-prog" id="rail-prog">0/4</span></button>
        <button class="rail-btn" id="btn-daily" title="Täglicher Bonus">🎁<span class="rail-badge" id="badge-daily">!</span></button>
        <button class="rail-btn" id="btn-ach" title="Erfolge">🏆<span class="rail-badge" id="badge-ach"></span></button>
        <button class="rail-btn hidden" id="btn-showact" title="Show-Act">💃</button>
      </div>
      <div id="income-rate" title="Einkommen pro Sekunde">0 €/s</div>
      <div id="hype-meter">
        <div id="hype-fill"></div>
        <span id="hype-label">🔥 Hype 0%</span>
      </div>
      <div id="tap-hint">💶 Geld-Symbole antippen & einsammeln!</div>
    </div>

    <!-- Untere Navigation -->
    <nav id="bottomnav">
      <button class="nav-btn" id="btn-shop"><span class="nav-icon">🏪</span><span class="nav-label">Shop</span></button>
      <button class="nav-btn" id="btn-stations"><span class="nav-icon">🔨</span><span class="nav-label">Ausbau</span></button>
      <button class="nav-btn boost" id="btn-boost">
        <span id="boost-timer" class="boost-chip">▶ Bereit</span>
        <span class="nav-icon">💵</span>
        <span class="nav-label" id="boost-label">x2 Einkommen</span>
      </button>
      <button class="nav-btn" id="btn-staff"><span class="nav-icon">👥</span><span class="nav-label">Personal</span></button>
      <button class="nav-btn" id="btn-rooms"><span class="nav-icon">📍</span><span class="nav-label">Räume</span></button>
    </nav>

    <!-- Overlays -->
    <div id="floats"></div>
    <div id="modal-root"></div>
    <div id="toast"></div>

    <!-- Start-Splash (startet Musik & Audio zuverlässig beim ersten Tap) -->
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-logo">✈</div>
        <h1 class="splash-title">AIRPORT</h1>
        <p class="splash-sub">Club Simulator</p>
        <button id="splash-start" class="splash-btn">▶ Tippen zum Starten</button>
        <p class="splash-hint">🔊 Mit Sound & Clubmusik</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
