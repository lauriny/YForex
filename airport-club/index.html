<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171b33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Airport – Club Simulator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- HUD oben -->
    <header id="hud">
      <button id="btn-settings" title="Einstellungen"><i data-ic="gear"></i></button>
      <div class="pill" id="hud-level"><span class="pill-icon"><i data-ic="star"></i></span><span class="pill-val">Lvl 1</span></div>
      <div class="hud-spacer"></div>
      <div class="pill" id="hud-gems"><span class="pill-icon"><i data-ic="gem"></i></span><span class="pill-val">0</span></div>
      <div class="pill" id="hud-cash"><span class="pill-icon"><i data-ic="cash"></i></span><span class="pill-val">0</span></div>
    </header>

    <!-- Upgrade-Karten -->
    <div id="upgrade-cards"></div>

    <!-- Club-Ansicht (alle Räume im Grundriss) -->
    <div id="club-view">
      <canvas id="club-canvas"></canvas>
      <div id="event-banner"></div>
      <button id="loc-switch" class="hidden" title="Standort wechseln"><i data-ic="ship"></i><span id="loc-label">Zum Boot</span></button>
      <!-- Die Nacht: Uhrzeit, Ziel und Ruf — der Kern des Spiels, immer sichtbar -->
      <button id="nightbar" title="Die Nacht">
        <span class="nb-head">
          <span id="nb-clock">22:00</span>
          <span id="nb-chapter">Die erste Nacht</span>
          <span id="nb-rep"></span>
        </span>
        <span class="nb-track"><i id="nb-fill"></i></span>
        <span class="nb-goal" id="nb-goal">Nachtziel</span>
      </button>
      <!-- Kopfzeile der Raum-Detailansicht -->
      <div id="room-hud" class="hidden">
        <button id="room-back">‹ Übersicht</button>
        <div id="room-switch">
          <button id="room-prev" class="room-arrow" title="Vorheriger Raum">‹</button>
          <button id="room-title" title="Raum wählen"></button>
          <button id="room-next" class="room-arrow" title="Nächster Raum">›</button>
        </div>
      </div>
      <!-- schwebende Seiten-Buttons (Tycoon-Style) -->
      <div id="side-rail">
        <button class="rail-btn" id="btn-goals" title="Story & Ziele"><i data-ic="book"></i><span class="rail-prog" id="rail-prog">0/4</span></button>
        <button class="rail-btn" id="btn-rivals" title="Weltrangliste"><i data-ic="globe"></i><span class="rail-badge" id="badge-rivals"></span></button>
        <button class="rail-btn hidden" id="btn-underground" title="Illegale Geschäfte"><i data-ic="shades"></i><span class="rail-badge" id="badge-ug"></span></button>
        <button class="rail-btn" id="btn-more" title="Mehr"><i data-ic="dots"></i><span class="rail-badge" id="badge-more"></span></button>
      </div>
      <div id="income-rate" title="Einkommen pro Sekunde">0 €/s</div>
      <div id="hype-meter">
        <div id="hype-fill"></div>
        <span id="hype-label"><i data-ic="flame"></i> Hype 0%</span>
      </div>
    </div>

    <!-- Untere Navigation -->
    <nav id="bottomnav">
      <button class="nav-btn" id="btn-stations"><span class="nav-icon"><i data-ic="hammer"></i></span><span class="nav-label">Ausbau</span></button>
      <button class="nav-btn boost" id="btn-boost">
        <span id="boost-timer" class="boost-chip">▶ Bereit</span>
        <span class="nav-icon"><i data-ic="bolt"></i></span>
        <span class="nav-label" id="boost-label">x2 Einkommen</span>
      </button>
      <button class="nav-btn" id="btn-staff"><span class="nav-icon"><i data-ic="people"></i></span><span class="nav-label">Personal</span></button>
      <button class="nav-btn" id="btn-rooms"><span class="nav-icon"><i data-ic="pin"></i></span><span class="nav-label">Räume</span></button>
    </nav>

    <!-- Overlays -->
    <div id="floats"></div>
    <div id="modal-root"></div>
    <div id="toast"></div>

    <!-- Start-Splash (startet Musik & Audio zuverlässig beim ersten Tap) -->
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-logo"><i data-ic="plane"></i></div>
        <h1 class="splash-title">AIRPORT</h1>
        <p class="splash-sub">Club Simulator</p>
        <button id="splash-start" class="splash-btn">▶ Tippen zum Starten</button>
        <p class="splash-hint">Mit Sound &amp; Clubmusik</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
