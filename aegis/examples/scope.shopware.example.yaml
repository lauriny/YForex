# Aegis scope — Shopware storefront, SAFE read-only first pass.
#
# Use this for an authorized owner-run assessment of a self-hosted Shopware shop.
# It performs NO state-changing actions: no orders, no deletes, no writes.
# It authenticates two customer test accounts and checks read access control
# (can customer A read customer B's orders/addresses?), plus response headers and
# cookie flags.
#
# Authorization: run this only against a shop you own/operate, with the owner's
# consent, from a network you are allowed to use.

target:
  # Replace with the real shop host. The bare domain also authorizes www./subdomains.
  domains: ["partyleihkiste.de"]
  seeds:
    - "https://partyleihkiste.de/"
    - "https://partyleihkiste.de/account"        # customer area entry point
  include_subdomains: true

environment:
  production: true
  # Read-only checks below need NO active-testing opt-in, so we leave the
  # production interlock ON. Only flip this (and active_testing) later, deliberately,
  # if you decide to run state-changing probes.
  allow_production_active_testing: false

# TWO distinct customer test accounts the owner creates in the shop. Cross-user
# access control needs at least two identities.
#
# Login method = email/password form login. Aegis fetches the login page, lifts
# Shopware's hidden _csrf_token automatically, and posts the credentials — no
# manual cookie copying needed. (Shopware storefront login field names are
# 'email' and 'password'.)
accounts:
  - username: "testa@example.com"
    password: "PASSWORT_A"
    role: "customer"
    login:
      url: "https://partyleihkiste.de/account/login"
      method: "POST"
      username_field: "email"
      password_field: "password"
  - username: "testb@example.com"
    password: "PASSWORT_B"
    role: "customer"
    login:
      url: "https://partyleihkiste.de/account/login"
      method: "POST"
      username_field: "email"
      password_field: "password"

# --- Alternative if form login fails (e.g. bot protection on the login page): ---
# Log in as each user in a browser, copy the Cookie header, and use instead:
#   login: {url: "https://partyleihkiste.de/account", cookie: "session-=...; ..."}

testing:
  active_testing: false          # read-only: no POST/PUT/DELETE probing
  authenticated_testing: true
  api_testing: true
  business_logic_testing: true
  request_delay_seconds: 1.0     # gentle on a live shop
  max_pages: 150
  max_depth: 4

time_window:
  start: ""
  end: ""
